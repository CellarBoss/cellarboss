name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Default to read-only; jobs that need to write elevate their own permissions.
permissions:
  contents: read

# Releases publish images, docs and store builds; never run two at once, and
# never cancel one part-way through publishing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    uses: $/.github/workflows/_lint.yml
    permissions:
      contents: read
      security-events: write # zizmor uploads SARIF to code scanning when available

  tests:
    name: Tests
    uses: $/.github/workflows/_tests.yml

  smoke-android:
    name: Android Smoke Tests
    uses: $/.github/workflows/_smoke-android.yml

  build-api-docs:
    name: Build API Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, tests, smoke-android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node

      - name: Generate API docs
        run: pnpm --filter backend generate:docs
        env:
          APP_VERSION: ${{ github.ref_name }}

      - name: Upload API docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-docs
          path: apps/backend/docs/
          retention-days: 1

  build-webui-user-docs:
    name: Build WebUI User Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, tests, smoke-android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node
      - uses: $/.github/actions/setup-playwright

      - name: Generate documentation screenshots
        run: pnpm --filter @cellarboss/web docs:screenshots
        env:
          NEXT_TELEMETRY_DISABLED: 1
          CELLARBOSS_SERVER: http://localhost:5173
          BETTER_AUTH_SECRET: docs-build-secret
          BETTER_AUTH_URL: http://localhost:5173

      - name: Build user docs
        run: pnpm --filter @cellarboss/web docs:build

      - name: Upload user docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webui-user-docs
          path: apps/web/docs/.vitepress/dist/
          retention-days: 1

  build-mobile-user-docs:
    name: Build Mobile User Docs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint, tests, smoke-android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node
      - uses: $/.github/actions/setup-android

      - name: Build Android release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --build-cache

      - uses: $/.github/actions/start-mock-server

      - name: Generate screenshots
        timeout-minutes: 20
        uses: $/.github/actions/run-android-emulator
        with:
          script: |
            cd apps/mobile && pnpm docs:screenshots

      - name: Build mobile docs
        run: pnpm --filter @cellarboss/mobile docs:build

      - name: Upload mobile docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-user-docs
          path: apps/mobile/docs/.vitepress/dist/
          retention-days: 1

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-api-docs, build-webui-user-docs, build-mobile-user-docs]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download API docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-docs
          path: _site/api

      - name: Download webUI user docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webui-user-docs
          path: _site/web

      - name: Download mobile user docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mobile-user-docs
          path: _site/mobile

      - name: Create landing page
        run: |
          cat > _site/index.html << 'LANDING'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Cellarboss Documentation</title>
            <meta http-equiv="refresh" content="0; url=web/">
          </head>
          <body>
            <a href="web/">Web UI User Guide</a> | <a href="mobile/">Mobile App Guide</a> | <a href="api/">API Reference</a>
          </body>
          </html>
          LANDING

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [lint, tests, smoke-android]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node

      # No prebuild cache here: the release build always runs a clean prebuild
      # with APP_VERSION set, and must not seed the cache the test jobs share.
      - uses: $/.github/actions/setup-android
        with:
          prebuild-cache: false
          app-version: ${{ github.ref_name }}

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build Android release AAB
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload Android AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 1

  deploy-android:
    name: Deploy to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-android]

    steps:
      - name: Download Android AAB
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-aab
          path: artifacts/

      - name: Generate What's New text
        env:
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p whatsnew
          echo "See what's new in this release: https://github.com/${RELEASE_REPO}/releases/tag/${RELEASE_TAG}" > whatsnew/whatsnew-en-US
          echo "See what's new in this release: https://github.com/${RELEASE_REPO}/releases/tag/${RELEASE_TAG}" > whatsnew/whatsnew-en-GB

      - name: Upload to Google Play (Internal Testing)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.cellarboss.mobile
          releaseFiles: artifacts/app-release.aab
          track: internal
          status: draft
          whatsNewDirectory: whatsnew

  create-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-publish, build-android]
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Android AAB
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-aab
          path: artifacts/

      - name: Rename AAB with version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: mv artifacts/app-release.aab "artifacts/cellarboss-${RELEASE_TAG}-android.aab"

      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        id: release
        with:
          publish: true
          tag: ${{ github.ref_name }}
          name: 'Release ${{ github.ref_name }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AAB to release
        run: gh release upload "$RELEASE_TAG" "artifacts/cellarboss-${RELEASE_TAG}-android.aab" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}

  # Builds each image natively per architecture and runs it, so a broken
  # image (e.g. a native module failing on arm64) blocks the release before
  # anything is pushed. Only reads the publish job's cache: that cache is
  # signed by docker/github-builder, so it must not be written from here.
  docker-smoke:
    name: Smoke Test ${{ matrix.image.name }} (${{ matrix.platform.slug }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: cellarboss-web
            file: apps/web/Dockerfile
            port: 3000
            smoke-path: /login
            smoke-env: |
              CELLARBOSS_SERVER=http://localhost:5000
              BETTER_AUTH_SECRET=smoke-test-secret
              BETTER_AUTH_URL=http://localhost:5000
          - name: cellarboss-backend
            file: apps/backend/Dockerfile
            port: 5000
            smoke-path: /api/version
            smoke-env: |
              DATABASE_TYPE=sqlite
              DATABASE_URL=/tmp/smoke.sqlite
              BETTER_AUTH_SECRET=smoke-test-secret
              BETTER_AUTH_URL=http://localhost:5000
        platform:
          - arch: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - arch: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.platform.arch }}
          load: true
          tags: smoke-test:local
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-linux-${{ matrix.platform.slug }}

      - name: Smoke test
        env:
          PORT: ${{ matrix.image.port }}
          SMOKE_PATH: ${{ matrix.image.smoke-path }}
          SMOKE_ENV: ${{ matrix.image.smoke-env }}
        run: |
          printf '%s\n' "$SMOKE_ENV" > "$RUNNER_TEMP/smoke.env"
          docker run -d --name smoke -p "${PORT}:${PORT}" --env-file "$RUNNER_TEMP/smoke.env" smoke-test:local

          TIMEOUT=120
          ELAPSED=0
          until curl -sf "http://localhost:${PORT}${SMOKE_PATH}" > /dev/null 2>&1; do
            if [ "$ELAPSED" -ge "$TIMEOUT" ] || [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "Container did not respond on ${SMOKE_PATH} after ${ELAPSED}s"
              docker logs smoke
              exit 1
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done
          echo "Container responded on ${SMOKE_PATH} after ${ELAPSED}s"
          docker rm -f smoke

  # docker/github-builder distributes the build across native runners per
  # platform, merges the multi-arch manifest, and signs the attestations.
  docker-publish:
    name: Publish ${{ matrix.image.name }}
    needs: [lint, tests, smoke-android, docker-smoke]
    permissions:
      contents: read
      packages: write
      id-token: write # signs attestations and cache entries via GitHub OIDC
    strategy:
      matrix:
        image:
          - name: cellarboss-web
            file: apps/web/Dockerfile
          - name: cellarboss-backend
            file: apps/backend/Dockerfile
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      file: ${{ matrix.image.file }}
      build-args: |
        APP_VERSION=${{ github.ref_name }}
      cache: true
      cache-scope: ${{ matrix.image.name }}
      cache-mode: max
      job-name-prefix: ${{ matrix.image.name }}
      # Registry names must be lowercase, so the org is not derived from github.repository_owner.
      meta-images: ghcr.io/cellarboss/${{ matrix.image.name }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}.{{minor}}.{{patch}}
        type=raw,value=latest
      set-meta-labels: true
      set-meta-annotations: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
