name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  prettier:
    name: Check Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node

      - name: Check formatting
        run: pnpm prettier --check "**/*.{ts,tsx,md}"

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node

      - name: Run ESLint
        run: pnpm -r --no-bail lint

  zizmor:
    name: Workflow Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Callers must grant security-events: write for the SARIF upload.
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning when available
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Auto-detect whether code scanning (SARIF upload) is available;
          # otherwise the action just fails the build on findings.
          advanced-security: auto
