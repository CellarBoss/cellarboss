name: Expo Auto Update

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

# Pushing the branch, opening the PR and enabling automerge all use PR_TOKEN,
# so the workflow token only needs to read.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  expo-update:
    name: Sync Expo Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node

      - name: Run Expo fix
        id: expo-fix
        working-directory: apps/mobile
        run: |
          pnpx expo install --fix
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dedupe dependencies
        if: steps.expo-fix.outputs.changed == 'true'
        run: pnpm dedupe

      - name: Create PR
        id: cpr
        if: steps.expo-fix.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.PR_TOKEN }}
          commit-message: "Auto sync Expo dependencies"
          delete-branch: true
          title: "deps: Sync Expo dependencies"
          labels: "skip-changelog"
          body: "Automated from workflow, generated with `pnpx expo install --fix`"
          branch: expo-dependency-sync

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-number
        run: gh pr merge --merge --auto "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
