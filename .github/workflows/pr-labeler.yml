name: PR Labeler & Release Draft

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened

permissions: {}

# Each run recomputes the draft from scratch, so a newer run supersedes an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    name: Update Release Draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    permissions:
      contents: write # create and update the draft release
      pull-requests: read # read merged PRs and their labels
    steps:
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  label:
    name: Autolabel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Fork PRs only get a read-only token on `pull_request`, so they are
    # labelled by hand. `pull_request_target` would label them, but GitHub's
    # default event policy blocks it in public repositories.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read # read the release-drafter config
      pull-requests: write # apply labels to the PR
    steps:
      - uses: release-drafter/release-drafter/autolabeler@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
