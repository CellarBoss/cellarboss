name: Android E2E Smoke Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test-android:
    name: Android Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node
      - uses: $/.github/actions/setup-android

      - name: Build Android release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --build-cache

      # The release reuses this emulator APK for mobile doc screenshots rather
      # than building it a second time.
      - name: Upload test APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1

      - uses: $/.github/actions/start-mock-server

      - uses: $/.github/actions/run-android-emulator
        with:
          script: |
            cd apps/mobile/e2e && maestro test --debug-output "$GITHUB_WORKSPACE/maestro-debug-output" --flatten-debug-output smoke/

      - name: Upload Maestro debug output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: maestro-debug-output
          path: maestro-debug-output/
          retention-days: 7
