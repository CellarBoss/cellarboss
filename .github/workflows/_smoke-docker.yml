name: Docker Smoke Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds each image natively per architecture and runs it, so a broken
  # image (e.g. a native module failing on arm64) blocks the release before
  # anything is pushed. Only reads the release publish job's cache: that cache
  # is signed by docker/github-builder, so it must not be written from here.
  docker-smoke:
    name: Smoke Test ${{ matrix.image.name }} (${{ matrix.platform.slug }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: cellarboss-web
            file: apps/web/Dockerfile
            port: 3000
            smoke-path: /login
            smoke-env: |
              CELLARBOSS_SERVER=http://localhost:5000
              BETTER_AUTH_SECRET=smoke-test-secret
              BETTER_AUTH_URL=http://localhost:5000
          - name: cellarboss-backend
            file: apps/backend/Dockerfile
            port: 5000
            smoke-path: /api/version
            smoke-env: |
              DATABASE_TYPE=sqlite
              DATABASE_URL=/tmp/smoke.sqlite
              BETTER_AUTH_SECRET=smoke-test-secret
              BETTER_AUTH_URL=http://localhost:5000
        platform:
          - arch: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - arch: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.platform.arch }}
          load: true
          tags: smoke-test:local
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-linux-${{ matrix.platform.slug }}

      - name: Smoke test
        env:
          PORT: ${{ matrix.image.port }}
          SMOKE_PATH: ${{ matrix.image.smoke-path }}
          SMOKE_ENV: ${{ matrix.image.smoke-env }}
        run: |
          printf '%s\n' "$SMOKE_ENV" > "$RUNNER_TEMP/smoke.env"
          docker run -d --name smoke -p "${PORT}:${PORT}" --env-file "$RUNNER_TEMP/smoke.env" smoke-test:local

          TIMEOUT=120
          ELAPSED=0
          until curl -sf "http://localhost:${PORT}${SMOKE_PATH}" > /dev/null 2>&1; do
            if [ "$ELAPSED" -ge "$TIMEOUT" ] || [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "Container did not respond on ${SMOKE_PATH} after ${ELAPSED}s"
              docker logs smoke
              exit 1
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done
          echo "Container responded on ${SMOKE_PATH} after ${ELAPSED}s"
          docker rm -f smoke
